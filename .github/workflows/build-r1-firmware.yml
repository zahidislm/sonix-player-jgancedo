name: Build HiBy R1 Firmware (Fast)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git pkg-config wget curl \
            p7zip-full squashfs-tools genisoimage perl \
            libsdl2-dev libfreetype-dev libopusfile-dev libwavpack-dev libasound2-dev

      - name: Download Pre-compiled MIPS Toolchain
        run: |
          mkdir -p sonix-player/rockbox-toolchain
          # Download a pre-built Rockbox MIPS toolchain archive directly
          # (If your project hosts a release tarball, replace this URL with your direct link)
          curl -sSL "https://github.com/rockbox/rockbox/releases/download/v3.15/rockbox-toolchain-mipsel.tar.bz2" | tar -xj -C sonix-player/rockbox-toolchain --strip-components=1 || true

      - name: Cache built static libraries
        uses: actions/cache@v4
        with:
          path: |
            sonix-player/freetype-target
            sonix-player/audio-target
          key: ${{ runner.os }}-sonix-audio-libs-${{ hashFiles('sonix-player/Makefile') }}

      - name: Build target binaries
        working-directory: ./sonix-player
        run: make target -j$(nproc)

      - name: Prepare packer directory
        run: |
          cp sonix-player/sonix_player sonix-packer/
          find ./sonix-player -name sonix_launch -exec cp {} sonix-packer/ \;

      - name: Download stock R1 firmware
        run: |
          if [ -z "${{ secrets.R1_STOCK_FW_URL }}" ]; then
            echo "Error: R1_STOCK_FW_URL secret is not set."
            exit 1
          fi
          wget -O sonix-packer/r1_original.upt "${{ secrets.R1_STOCK_FW_URL }}"

      - name: Pack custom firmware
        working-directory: ./sonix-packer
        run: |
          chmod +x sonix_firmware_packer.sh
          ./sonix_firmware_packer.sh

      - name: Upload r1.upt artifact
        uses: actions/upload-artifact@v4
        with:
          name: r1-firmware
          path: sonix-packer/r1.upt
          if-no-files-found: error
